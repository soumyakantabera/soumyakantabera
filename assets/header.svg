<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#212161"/>
      <stop offset="50%" style="stop-color:#2D3A8C"/>
      <stop offset="100%" style="stop-color:#094542"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4750DD"/>
      <stop offset="100%" style="stop-color:#05C274"/>
    </linearGradient>
  </defs>
  
  <rect width="900" height="280" rx="12" fill="url(#bg)"/>
  
  <!-- Subtle dot pattern — top-right only -->
  <g opacity="0.06" fill="white">
    <circle cx="720" cy="30" r="1"/><circle cx="750" cy="30" r="1"/><circle cx="780" cy="30" r="1"/><circle cx="810" cy="30" r="1"/><circle cx="840" cy="30" r="1"/><circle cx="870" cy="30" r="1"/>
    <circle cx="720" cy="55" r="1"/><circle cx="750" cy="55" r="1"/><circle cx="780" cy="55" r="1"/><circle cx="810" cy="55" r="1"/><circle cx="840" cy="55" r="1"/><circle cx="870" cy="55" r="1"/>
    <circle cx="720" cy="80" r="1"/><circle cx="750" cy="80" r="1"/><circle cx="780" cy="80" r="1"/><circle cx="810" cy="80" r="1"/><circle cx="840" cy="80" r="1"/><circle cx="870" cy="80" r="1"/>
  </g>
  
  <!-- Name -->
  <text x="450" y="85" font-family="'Segoe UI', system-ui, sans-serif" font-size="46" font-weight="700" fill="white" text-anchor="middle" letter-spacing="2">SOUMYAKANTA BERA</text>
  
  <!-- Accent line -->
  <rect x="350" y="102" width="200" height="2.5" rx="1.25" fill="url(#line)"/>
  
  <!-- Tagline -->
  <text x="450" y="138" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#85D5F6" text-anchor="middle" font-weight="600" letter-spacing="3">FINANCE · ANALYTICS · INTELLIGENCE</text>
  
  <!-- Subtitle -->
  <text x="450" y="170" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="0.5">Python × Power BI × Excel × AI/ML — turning raw data into financial edge</text>
  
  <!-- Tech pills -->
  <g font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">
    <!-- Python -->
    <rect x="173" y="190" width="70" height="24" rx="12" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="208" y="206" fill="#85D5F6">Python</text>
    <!-- Power BI -->
    <rect x="253" y="190" width="80" height="24" rx="12" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="293" y="206" fill="#F2C811">Power BI</text>
    <!-- Excel -->
    <rect x="343" y="190" width="64" height="24" rx="12" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="375" y="206" fill="#05C274">Excel</text>
    <!-- SQL -->
    <rect x="417" y="190" width="54" height="24" rx="12" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="444" y="206" fill="#E97627">SQL</text>
    <!-- Snowflake -->
    <rect x="481" y="190" width="82" height="24" rx="12" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="522" y="206" fill="#29B5E8">Snowflake</text>
    <!-- Claude API -->
    <rect x="573" y="190" width="86" height="24" rx="12" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="616" y="206" fill="#BCFB89">Claude API</text>
    <!-- SAP -->
    <rect x="669" y="190" width="58" height="24" rx="12" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="698" y="206" fill="#0FAAFF">SAP</text>
  </g>
  
  <!-- Location -->
  <text x="450" y="248" font-family="'Segoe UI', sans-serif" font-size="11" fill="rgba(255,255,255,0.45)" text-anchor="middle" letter-spacing="0.5">Florence, Italy · MSc Finance &amp; Risk Management · University of Florence</text>
</svg>
