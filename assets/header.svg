
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F4F8"/>
      <stop offset="100%" style="stop-color:#E2E8F0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4750DD"/>
      <stop offset="100%" style="stop-color:#05C274"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;display=swap');
    </style>
  </defs>

  <!-- Light background -->
  <rect width="900" height="340" rx="12" fill="url(#bg)"/>

  <!-- Subtle grid dots -->
  <g opacity="0.07" fill="#4750DD">
    <circle cx="40" cy="40" r="1.2"/><circle cx="70" cy="40" r="1.2"/><circle cx="100" cy="40" r="1.2"/><circle cx="130" cy="40" r="1.2"/><circle cx="160" cy="40" r="1.2"/>
    <circle cx="40" cy="65" r="1.2"/><circle cx="70" cy="65" r="1.2"/><circle cx="100" cy="65" r="1.2"/><circle cx="130" cy="65" r="1.2"/><circle cx="160" cy="65" r="1.2"/>
    <circle cx="40" cy="90" r="1.2"/><circle cx="70" cy="90" r="1.2"/><circle cx="100" cy="90" r="1.2"/><circle cx="130" cy="90" r="1.2"/><circle cx="160" cy="90" r="1.2"/>
    <circle cx="740" cy="250" r="1.2"/><circle cx="770" cy="250" r="1.2"/><circle cx="800" cy="250" r="1.2"/><circle cx="830" cy="250" r="1.2"/><circle cx="860" cy="250" r="1.2"/>
    <circle cx="740" cy="275" r="1.2"/><circle cx="770" cy="275" r="1.2"/><circle cx="800" cy="275" r="1.2"/><circle cx="830" cy="275" r="1.2"/><circle cx="860" cy="275" r="1.2"/>
    <circle cx="740" cy="300" r="1.2"/><circle cx="770" cy="300" r="1.2"/><circle cx="800" cy="300" r="1.2"/><circle cx="830" cy="300" r="1.2"/><circle cx="860" cy="300" r="1.2"/>
  </g>

  <!-- Name -->
  <text x="450" y="105" font-family="'Manrope', 'Segoe UI', system-ui, sans-serif" font-size="48" font-weight="800" fill="#1A202C" text-anchor="middle" letter-spacing="1">Soumyakanta Bera</text>

  <!-- Accent line -->
  <rect x="340" y="122" width="220" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Tagline -->
  <text x="450" y="158" font-family="'Manrope', 'Segoe UI', system-ui, sans-serif" font-size="16" fill="#4A5568" text-anchor="middle" font-weight="600" letter-spacing="0.5">Where finance meets data — and the spreadsheet always wins.</text>

  <!-- Stack pills -->
  <g font-family="'Manrope', 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    <rect x="155" y="184" width="72" height="26" rx="13" fill="#3776AB"/>
    <text x="191" y="201" fill="white">Python</text>

    <rect x="237" y="184" width="82" height="26" rx="13" fill="#F2C811"/>
    <text x="278" y="201" fill="#1A202C">Power BI</text>

    <rect x="329" y="184" width="62" height="26" rx="13" fill="#217346"/>
    <text x="360" y="201" fill="white">Excel</text>

    <rect x="401" y="184" width="52" height="26" rx="13" fill="#336791"/>
    <text x="427" y="201" fill="white">SQL</text>

    <rect x="463" y="184" width="82" height="26" rx="13" fill="#29B5E8"/>
    <text x="504" y="201" fill="white">Snowflake</text>

    <rect x="555" y="184" width="56" height="26" rx="13" fill="#0FAAFF"/>
    <text x="583" y="201" fill="white">SAP</text>

    <rect x="621" y="184" width="50" height="26" rx="13" fill="#FF694B"/>
    <text x="646" y="201" fill="white">dbt</text>

    <rect x="681" y="184" width="70" height="26" rx="13" fill="#191919"/>
    <text x="716" y="201" fill="white">Claude</text>
  </g>

  <!-- Sub info -->
  <text x="450" y="248" font-family="'Manrope', 'Segoe UI', sans-serif" font-size="12" fill="#718096" text-anchor="middle" font-weight="600" letter-spacing="2">FINANCE · ANALYTICS · INTELLIGENCE</text>

  <!-- Bottom line -->
  <text x="450" y="278" font-family="'Manrope', 'Segoe UI', sans-serif" font-size="11" fill="#A0AEC0" text-anchor="middle" letter-spacing="0.3">MSc Finance &amp; Risk Management · University of Florence · Florence, Italy</text>

  <!-- Stats -->
  <g font-family="'Manrope', 'Segoe UI', sans-serif" text-anchor="middle" y="310">
    <text x="225" y="316" font-size="22" font-weight="800" fill="#4750DD">13</text>
    <text x="225" y="332" font-size="9" font-weight="600" fill="#718096" letter-spacing="0.5">FORAGE SIMS</text>

    <text x="375" y="316" font-size="22" font-weight="800" fill="#05C274">11</text>
    <text x="375" y="332" font-size="9" font-weight="600" fill="#718096" letter-spacing="0.5">CERTIFICATIONS</text>

    <text x="525" y="316" font-size="22" font-weight="800" fill="#094542">1</text>
    <text x="525" y="332" font-size="9" font-weight="600" fill="#718096" letter-spacing="0.5">M&amp;A INTERNSHIP</text>

    <text x="675" y="316" font-size="22" font-weight="800" fill="#212161">48</text>
    <text x="675" y="332" font-size="9" font-weight="600" fill="#718096" letter-spacing="0.5">THESIS FORMULAS</text>
  </g>
</svg>
