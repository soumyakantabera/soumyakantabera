<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F4F8"/>
      <stop offset="100%" style="stop-color:#E2E8F0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4750DD"/>
      <stop offset="100%" style="stop-color:#05C274"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;display=swap');
    </style>
  </defs>

  <rect width="900" height="260" rx="12" fill="url(#bg)"/>

  <!-- Subtle grid dots -->
  <g opacity="0.07" fill="#4750DD">
    <circle cx="40" cy="35" r="1.2"/><circle cx="70" cy="35" r="1.2"/><circle cx="100" cy="35" r="1.2"/><circle cx="130" cy="35" r="1.2"/><circle cx="160" cy="35" r="1.2"/>
    <circle cx="40" cy="60" r="1.2"/><circle cx="70" cy="60" r="1.2"/><circle cx="100" cy="60" r="1.2"/><circle cx="130" cy="60" r="1.2"/><circle cx="160" cy="60" r="1.2"/>
    <circle cx="740" cy="200" r="1.2"/><circle cx="770" cy="200" r="1.2"/><circle cx="800" cy="200" r="1.2"/><circle cx="830" cy="200" r="1.2"/><circle cx="860" cy="200" r="1.2"/>
    <circle cx="740" cy="225" r="1.2"/><circle cx="770" cy="225" r="1.2"/><circle cx="800" cy="225" r="1.2"/><circle cx="830" cy="225" r="1.2"/><circle cx="860" cy="225" r="1.2"/>
  </g>

  <!-- Name -->
  <text x="450" y="80" font-family="'Manrope', 'Segoe UI', system-ui, sans-serif" font-size="48" font-weight="800" fill="#1A202C" text-anchor="middle" letter-spacing="1">Soumyakanta Bera</text>

  <!-- Accent line -->
  <rect x="340" y="97" width="220" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Tagline -->
  <text x="450" y="130" font-family="'Manrope', 'Segoe UI', system-ui, sans-serif" font-size="16" fill="#4A5568" text-anchor="middle" font-weight="600" letter-spacing="0.5">Where finance meets data — and the spreadsheet always wins.</text>

  <!-- Stack pills -->
  <g font-family="'Manrope', 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    <rect x="155" y="150" width="72" height="26" rx="13" fill="#3776AB"/>
    <text x="191" y="167" fill="white">Python</text>

    <rect x="237" y="150" width="82" height="26" rx="13" fill="#F2C811"/>
    <text x="278" y="167" fill="#1A202C">Power BI</text>

    <rect x="329" y="150" width="62" height="26" rx="13" fill="#217346"/>
    <text x="360" y="167" fill="white">Excel</text>

    <rect x="401" y="150" width="52" height="26" rx="13" fill="#336791"/>
    <text x="427" y="167" fill="white">SQL</text>

    <rect x="463" y="150" width="82" height="26" rx="13" fill="#29B5E8"/>
    <text x="504" y="167" fill="white">Snowflake</text>

    <rect x="555" y="150" width="56" height="26" rx="13" fill="#0FAAFF"/>
    <text x="583" y="167" fill="white">SAP</text>

    <rect x="621" y="150" width="50" height="26" rx="13" fill="#FF694B"/>
    <text x="646" y="167" fill="white">dbt</text>

    <rect x="681" y="150" width="70" height="26" rx="13" fill="#191919"/>
    <text x="716" y="167" fill="white">Claude</text>
  </g>

  <!-- FINANCE · ANALYTICS · INTELLIGENCE — bigger -->
  <text x="450" y="215" font-family="'Manrope', 'Segoe UI', sans-serif" font-size="15" fill="#718096" text-anchor="middle" font-weight="700" letter-spacing="3">FINANCE · ANALYTICS · INTELLIGENCE</text>

  <!-- MSc line — bigger -->
  <text x="450" y="245" font-family="'Manrope', 'Segoe UI', sans-serif" font-size="13" fill="#4A5568" text-anchor="middle" font-weight="500" letter-spacing="0.3">MSc Finance &amp; Risk Management · University of Florence · Florence, Italy</text>
</svg>
